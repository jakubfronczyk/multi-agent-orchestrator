[workspace]
resolver = "3"
members = ["orchestrator-core", "orchestrator-server"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl", "serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
