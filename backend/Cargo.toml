[workspace]
resolver = "3"
members = ["orchestrator-core", "orchestrator-server"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
anyhow = "1"
calamine = { version = "0.37", features = ["dates"] }
pdf-extract = "0.12"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
axum = { version = "0.8", features = ["multipart"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dotenvy = "0.15"
rand = "0.10"
schemars = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros", "json"] }
thiserror = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl", "serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
